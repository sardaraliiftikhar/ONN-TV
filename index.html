<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONN TV | Online News Network</title>

  <link rel="stylesheet" href="style.css?v=3">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="container">
      <span id="todayDate"></span>
      <span>ONN TV • Online News Network</span>
    </div>
  </div>


  <!-- HEADER -->
  <header class="header">

    <div class="container header-inner">

      <a href="index.html" class="logo">
        <span>ONN</span> TV
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="#latest">Latest</a>
        <a href="#pakistan">Pakistan</a>
        <a href="#world">World</a>
        <a href="#sports">Sports</a>
        <a href="#business">Business</a>
        <a href="#technology">Technology</a>
      </nav>

    </div>

  </header>


  <!-- BREAKING NEWS -->
  <div class="breaking-bar">

    <div class="container breaking-inner">

      <span class="breaking-label">
        BREAKING
      </span>

      <span>
        Welcome to ONN TV — Online News Network
      </span>

    </div>

  </div>


  <!-- MAIN -->
  <main class="container">

    <div class="news-layout">


      <!-- HERO -->
      <section class="hero-card">

        <div class="hero-image">
          <span>ONN TV</span>
        </div>

        <div class="hero-content">

          <span class="category">
            TOP STORY
          </span>

          <h1>
            Latest News
          </h1>

          <p>
            Get the latest news and updates from ONN TV.
          </p>

          <a href="#" class="read-more">
            Read Full Story →
          </a>

        </div>

      </section>


      <!-- LATEST NEWS -->
      <aside class="latest-box" id="latest">

        <div class="latest-header">

          <h2>
            Latest News
          </h2>

          <span class="latest-live">
            Live
          </span>

        </div>

        <div id="latestNews"></div>

      </aside>


    </div>

  </main>


  <script>

    const dateElement =
      document.getElementById("todayDate");

    dateElement.textContent =
      new Date().toLocaleDateString(
        "en-US",
        {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

  </script>


  <script src="app.js?v=3"></script>

</body>
</html>
