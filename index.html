<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONN TV | Online News Network</title>

  <link rel="stylesheet" href="style.css?v=10">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

</head>


<body>

  <!-- TOP BAR -->
  <div class="topbar">

    <div class="page">

      <div id="date"></div>

      <div>
        ONN TV • Online News Network
      </div>

    </div>

  </div>


  <!-- HEADER -->
  <header class="header">

    <div class="page header-inner">

      <a href="index.html" class="logo">
        <span>ONN</span> TV
      </a>


      <nav class="menu">

        <a href="index.html">Home</a>

        <a href="#latest">Latest</a>

        <a href="#pakistan">Pakistan</a>

        <a href="#world">World</a>

        <a href="#sports">Sports</a>

        <a href="#business">Business</a>

        <a href="#technology">Technology</a>

      </nav>


      <div class="search-icon">
        ⌕
      </div>

    </div>

  </header>


  <!-- BREAKING -->
  <div class="breaking">

    <div class="page breaking-inner">

      <strong>BREAKING</strong>

      <span>
        Welcome to ONN TV — Online News Network
      </span>

    </div>

  </div>


  <!-- CONTENT -->
  <main class="page main">


    <div class="home-grid">


      <!-- ================= HERO ================= -->

      <section class="hero" id="hero">

        <div class="hero-image">

          <div class="hero-placeholder">
            ONN TV
          </div>

        </div>


        <div class="hero-info">

          <div class="category">
            TOP STORY
          </div>


          <h1>
            Latest News
          </h1>


          <p>
            Get the latest news and updates from ONN TV.
          </p>


          <a href="#" class="read-button">
            Read Full Story →
          </a>

        </div>

      </section>


      <!-- ================= LATEST ================= -->

      <aside class="latest" id="latest">

        <div class="latest-title">

          <h2>
            Latest News
          </h2>

          <span>
            Live
          </span>

        </div>


        <div id="latestNews">

          <div class="loading">
            Loading news...
          </div>

        </div>

      </aside>


    </div>


  </main>


  <script>

    document.getElementById("date").textContent =
      new Date().toLocaleDateString(
        "en-US",
        {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

  </script>


  <script src="app.js?v=10"></script>

</body>

</html>
