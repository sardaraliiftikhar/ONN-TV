<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONN TV | News</title>

  <link rel="stylesheet" href="style.css?v=11">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="page">
      <span id="date"></span>
      <span>ONN TV • Online News Network</span>
    </div>
  </div>


  <!-- HEADER -->
  <header class="header">

    <div class="page header-inner">

      <a href="index.html" class="logo">
        <span>ONN</span> TV
      </a>

      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="index.html#latest">Latest</a>
        <a href="index.html#pakistan">Pakistan</a>
        <a href="index.html#world">World</a>
        <a href="index.html#sports">Sports</a>
        <a href="index.html#business">Business</a>
        <a href="index.html#technology">Technology</a>
      </nav>

    </div>

  </header>


  <!-- BREAKING -->
  <div class="breaking">
    <div class="page breaking-inner">
      <strong>BREAKING</strong>
      <span>ONN TV — Online News Network</span>
    </div>
  </div>


  <!-- ARTICLE -->
  <main class="page article-container">

    <a href="index.html" class="back-button">
      ← Back to Home
    </a>

    <article id="article">

      <div class="article-loading">
        Loading story...
      </div>

    </article>

  </main>


  <script>

    document.getElementById("date").textContent =
      new Date().toLocaleDateString(
        "en-US",
        {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

  </script>


  <script src="article.js?v=11"></script>

</body>

</html>
