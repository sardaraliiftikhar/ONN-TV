<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONN TV — Admin Panel</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="container header-content">

      <a href="index.html" class="logo">

        <span class="logo-onn">ONN</span>
        <span class="logo-tv">TV</span>

      </a>

      <div class="header-date">
        ایڈمن پینل
      </div>

    </div>

  </header>


  <!-- ================= ADMIN AREA ================= -->

  <main class="admin-page">

    <div class="container">


      <!-- ================= LOGIN ================= -->

      <section
        class="admin-box"
        id="loginBox">

        <div class="admin-title">

          <h1>
            ONN TV ایڈمن لاگ اِن
          </h1>

          <p>
            صرف مجاز صارفین کے لیے
          </p>

        </div>


        <form id="loginForm">

          <div class="form-group">

            <label for="email">
              ای میل
            </label>

            <input
              type="email"
              id="email"
              placeholder="اپنی ای میل درج کریں"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              پاس ورڈ
            </label>

            <input
              type="password"
              id="password"
              placeholder="اپنا پاس ورڈ درج کریں"
              required
            >

          </div>


          <button
            type="submit"
            class="admin-button">

            لاگ اِن

          </button>


          <div
            id="loginMessage"
            class="admin-message">
          </div>

        </form>

      </section>


      <!-- ================= ADMIN PANEL ================= -->

      <section
        class="admin-box"
        id="adminPanel"
        style="display:none;">

        <div class="admin-header">

          <div>

            <h1>
              ONN TV نیوز ڈیسک
            </h1>

            <p>
              نئی خبر شائع کریں
            </p>

          </div>


          <button
            type="button"
            id="logoutBtn"
            class="logout-button">

            لاگ آؤٹ

          </button>

        </div>


        <!-- ================= NEWS FORM ================= -->

        <form id="newsForm">


          <!-- TITLE -->

          <div class="form-group">

            <label for="title">
              خبر کا عنوان
            </label>

            <input
              type="text"
              id="title"
              placeholder="خبر کا مکمل عنوان"
              required
            >

          </div>


          <!-- CATEGORY -->

          <div class="form-group">

            <label for="category">
              کیٹیگری
            </label>

            <select
              id="category"
              required>

              <option value="">
                کیٹیگری منتخب کریں
              </option>

              <option value="پاکستان">
                پاکستان
              </option>

              <option value="دنیا">
                دنیا
              </option>

              <option value="کھیل">
                کھیل
              </option>

              <option value="کاروبار">
                کاروبار
              </option>

              <option value="ٹیکنالوجی">
                ٹیکنالوجی
              </option>

              <option value="تازہ خبر">
                تازہ خبر
              </option>

            </select>

          </div>


          <!-- EXCERPT -->

          <div class="form-group">

            <label for="excerpt">
              مختصر خبر
            </label>

            <textarea
              id="excerpt"
              rows="4"
              placeholder="خبر کا مختصر خلاصہ لکھیں"
            ></textarea>

          </div>


          <!-- CONTENT -->

          <div class="form-group">

            <label for="content">
              مکمل خبر
            </label>

            <textarea
              id="content"
              rows="12"
              placeholder="یہاں خبر کی مکمل تفصیل لکھیں"
              required
            ></textarea>

          </div>


          <!-- AUTHOR -->

          <div class="form-group">

            <label for="author">
              رپورٹر / مصنف
            </label>

            <input
              type="text"
              id="author"
              value="ONN TV News Desk"
              placeholder="مصنف کا نام"
            >

          </div>


          <!-- IMAGE -->

          <div class="form-group">

            <label for="image">
              خبر کی تصویر
            </label>

            <input
              type="file"
              id="image"
              accept="image/*"
            >

            <small>
              JPG، PNG یا WebP تصویر منتخب کریں
            </small>

          </div>


          <!-- PUBLISH -->

          <button
            type="submit"
            class="publish-button">

            📰 خبر شائع کریں

          </button>


          <!-- STATUS -->

          <div
            id="status"
            class="admin-message">
          </div>


        </form>

      </section>


    </div>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer class="footer">

    <div class="container">

      <div class="copyright">

        © 2026 ONN TV — Admin Panel

      </div>

    </div>

  </footer>


  <!-- ================= SUPABASE ================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- CONFIG -->

  <script src="config.js"></script>


  <!-- ADMIN SCRIPT -->

  <script src="admin.js"></script>


</body>

</html>
