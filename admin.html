<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONN TV — ایڈمن پینل</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <div class="container header-content">

    <a href="index.html" class="logo">

      <span class="logo-onn">
        ONN
      </span>

      <span class="logo-tv">
        TV
      </span>

    </a>

    <div class="header-date">
      ایڈمن پینل
    </div>

  </div>

</header>


<main>

  <div class="container">


    <!-- ================= LOGIN ================= -->

    <div
      class="admin-box"
      id="loginBox">

      <div class="admin-header">

        <span class="admin-icon">
          🔐
        </span>

        <h1>
          ONN TV ایڈمن
        </h1>

        <p>
          News Management System
        </p>

      </div>


      <form id="loginForm">

        <label>
          ای میل
        </label>

        <input
          type="email"
          id="email"
          placeholder="Admin Email"
          required
        >


        <label>
          پاس ورڈ
        </label>

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >


        <button
          type="submit"
          class="admin-button">

          لاگ اِن

        </button>


        <div
          class="admin-message"
          id="loginMessage">
        </div>

      </form>

    </div>


    <!-- ================= ADMIN PANEL ================= -->

    <div
      class="admin-box"
      id="adminPanel"
      style="display:none;">


      <div class="admin-header">

        <span class="admin-icon">
          📰
        </span>

        <h1>
          ONN TV News Desk
        </h1>

        <p>
          خبریں شائع کریں اور manage کریں
        </p>

      </div>


      <!-- ================= NEWS FORM ================= -->

      <form id="newsForm">


        <input
          type="hidden"
          id="editingId"
        >


        <label>
          خبر کا عنوان
        </label>

        <input
          type="text"
          id="title"
          placeholder="خبر کا مکمل عنوان"
          required
        >


        <label>
          کیٹیگری
        </label>

        <select
          id="category"
          required>

          <option value="">
            کیٹیگری منتخب کریں
          </option>

          <option value="پاکستان">
            پاکستان
          </option>

          <option value="دنیا">
            دنیا
          </option>

          <option value="کھیل">
            کھیل
          </option>

          <option value="کاروبار">
            کاروبار
          </option>

          <option value="ٹیکنالوجی">
            ٹیکنالوجی
          </option>

          <option value="دیگر">
            دیگر
          </option>

        </select>


        <label>
          مختصر خبر
        </label>

        <textarea
          id="excerpt"
          rows="4"
          placeholder="خبر کا مختصر خلاصہ..."
          required></textarea>


        <label>
          مکمل خبر
        </label>

        <textarea
          id="content"
          rows="12"
          placeholder="خبر کی مکمل تفصیل..."
          required></textarea>


        <label>
          رپورٹر / مصنف
        </label>

        <input
          type="text"
          id="author"
          value="ONN TV News Desk"
        >


        <label>
          خبر کی نئی تصویر
        </label>

        <input
          type="file"
          id="image"
          accept="image/*"
        >


        <button
          type="submit"
          class="admin-button"
          id="publishButton">

          📰 خبر شائع کریں

        </button>


        <button
          type="button"
          class="logout-button"
          id="cancelEdit"
          style="display:none;">

          ❌ Edit Cancel کریں

        </button>


        <div
          class="admin-message"
          id="status">
        </div>

      </form>


      <!-- ================= NEWS LIST ================= -->

      <div class="admin-news-area">


        <div class="admin-news-title">

          <h2>
            📰 موجودہ خبریں
          </h2>

          <button
            type="button"
            id="refreshNews"
            class="refresh-button">

            🔄 Refresh

          </button>

        </div>


        <div
          id="adminNewsList"
          class="admin-news-list">

          <div class="loading">
            خبریں لوڈ ہو رہی ہیں...
          </div>

        </div>

      </div>


      <!-- ================= LOGOUT ================= -->

      <div style="padding: 0 35px 35px;">

        <button
          id="logoutBtn"
          class="logout-button">

          Logout

        </button>

      </div>


    </div>

  </div>

</main>


<footer class="footer">

  <div class="container footer-content">

    <div>

      <div class="footer-logo">

        <span>
          ONN
        </span>

        TV

      </div>

      <p>
        ONN TV News Management
      </p>

    </div>


    <div class="footer-menu">

      <a href="index.html">
        🏠 ویب سائٹ
      </a>

    </div>

  </div>


  <div class="copyright">

    © 2026 ONN TV — Admin Panel

  </div>

</footer>


<!-- SUPABASE -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- CONFIG -->

<script src="config.js"></script>


<!-- ADMIN SYSTEM -->

<script src="admin.js"></script>


</body>

</html>
